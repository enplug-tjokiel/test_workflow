name: Integrate to release
# on:
#   push:
#     branches: [ "main" ]
on:
  pull_request:
    types: [closed]
    branches:
      - 'release_v*'

jobs:
  process-version:
    if: >-
      github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout merged branch code
        uses: actions/checkout@v4
        with:
          # Checkout the exact merge commit on the target release branch
          ref: ${{ github.event.pull_request.base.ref }}

      # --- Replace this section with your actual build commands ---
      - name: Execute Build
        run: |
          mkdir -p output
          echo "Build output for version ${{ env.VERSION_STRING }}" > output/app-build.txt
      # -------------------------------------------------------------

      - name: Upload Build Artifacts
        id: artifact-upload
        uses: actions/upload-artifact@v4
        with:
          name: release-build-pr-${{ github.event.pull_request.number }}
          path: output/
          retention-days: 7

      - name: Comment PR with Artifact Link
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `###  PR Merged & Release Built!\n\n **[Download Release Artifacts](${runUrl}#artifacts)**`
            });
